plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.roomdisplay'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.roomdisplay"
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
